    <script>
      window.__hangmuLoadGtm = function () {
        var id = (window.__ENV__ && window.__ENV__.gtmId) || ''
        if (!/^GTM-[A-Z0-9]+$/.test(id) || window.__hangmuGtmLoaded) return
        window.__hangmuGtmLoaded = true
        window.dataLayer = window.dataLayer || []
        function gtag() {
          window.dataLayer.push(arguments)
        }
        gtag('js', new Date())
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtm.js?id=' + id
        document.head.appendChild(s)
      }
      try {
        if (localStorage.getItem('hangmu.analytics') === 'yes') window.__hangmuLoadGtm()
      } catch (e) {
      }
